name: Windows derlemesi

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Derle (tek dosyalık exe)
        run: dotnet publish src/StreamDeckk -c Release -o dist

      - name: Exe bilgisi
        shell: pwsh
        run: |
          $f = Get-Item dist\StreamDeckk.exe
          "{0:N1} MB" -f ($f.Length / 1MB)
          $f.VersionInfo | Format-List ProductName, FileVersion, ProductVersion

      # Gerçek Windows: kendi penceresine SendInput ile Türkçe metin yazıp okur, simge tepsisini ve sesi dener
      - name: Öz-test (klavye / simge tepsisi / ses)
        id: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath dist\StreamDeckk.exe -ArgumentList '--selftest', $out -PassThru
          $done = $p.WaitForExit(60000)
          if (-not $done) { Stop-Process $p -Force }
          Get-Content $out -Encoding utf8 -ErrorAction SilentlyContinue
          if (-not $done) { throw 'Öz-test 60 sn içinde bitmedi' }
          if ($p.ExitCode -ne 0) { throw "Öz-test başarısız (çıkış kodu $($p.ExitCode))" }

      - name: Programı başlat
        shell: pwsh
        run: |
          $env:STREAMDECKK_DATA = "$env:RUNNER_TEMP\sd"
          $p = Start-Process -FilePath dist\StreamDeckk.exe -ArgumentList '--hidden' -PassThru
          "SD_PID=$($p.Id)" | Out-File -Append $env:GITHUB_ENV
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { Get-Content "$env:STREAMDECKK_DATA\streamdeckk.log" -ErrorAction SilentlyContinue; throw "Program kapandı (çıkış kodu $($p.ExitCode))" }
            try { $r = Invoke-RestMethod http://127.0.0.1:7373/api/ping; "Hazır: $($r | ConvertTo-Json -Compress) ($i sn)"; break } catch { }
          }
          if ($i -ge 30) { throw 'Program 30 sn içinde yanıt vermedi' }

      - name: İkinci kopya açılmamalı
        shell: pwsh
        run: |
          $env:STREAMDECKK_DATA = "$env:RUNNER_TEMP\sd"
          $p = Start-Process -FilePath dist\StreamDeckk.exe -ArgumentList '--hidden' -PassThru
          if (-not $p.WaitForExit(20000)) { Stop-Process $p -Force; throw 'İkinci kopya kapanmadı' }
          "İkinci kopya çıkış kodu: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw 'İkinci kopya hata verdi' }
          if ((Get-Process -Id $env:SD_PID -ErrorAction SilentlyContinue) -eq $null) { throw 'İlk kopya kapanmış' }

      - name: Test bağımlılıkları
        run: |
          npm ci
          npx playwright install chromium

      - name: Uçtan uca testler (gerçek exe'ye karşı)
        shell: pwsh
        env:
          ALLOW_NO_AUDIO: '1'
          SHOTS: ${{ runner.temp }}\shots
          RESULTS: ${{ runner.temp }}\e2e-results.json
        run: |
          New-Item -ItemType Directory -Force $env:SHOTS | Out-Null
          node test/e2e/run.js
          if ($LASTEXITCODE -ne 0) { throw 'Uçtan uca testler başarısız' }

      - name: Yeniden başlatınca ayarlar korunur
        shell: pwsh
        run: |
          $env:STREAMDECKK_DATA = "$env:RUNNER_TEMP\sd"
          $before = (Get-Content "$env:STREAMDECKK_DATA\config.json" -Raw | ConvertFrom-Json)
          Stop-Process -Id $env:SD_PID -Force
          Start-Sleep -Seconds 2
          $p = Start-Process -FilePath dist\StreamDeckk.exe -ArgumentList '--hidden' -PassThru
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:7373/api/ping | Out-Null; break } catch { } }
          $cfg = Invoke-RestMethod http://127.0.0.1:7373/api/config
          $after = (Get-Content "$env:STREAMDECKK_DATA\config.json" -Raw | ConvertFrom-Json)
          if ($after.token -ne $before.token) { throw 'Eşleştirme anahtarı korunmadı' }
          if ($cfg.pages.Count -ne $before.pages.Count) { throw 'Sayfalar korunmadı' }
          "Ayarlar korundu: $($cfg.pages.Count) sayfa, ses %$($cfg.volume)"
          Stop-Process $p -Force

      - name: Kurulum sihirbazını derle
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp /DAppVersion=2.0.0 installer\StreamDeckk.iss
          if ($LASTEXITCODE -ne 0) { throw 'Kurulum derlenemedi' }
          "{0:N1} MB" -f ((Get-Item dist\StreamDeckk-Kurulum.exe).Length / 1MB)

      - name: Kurulum ve kaldırma testi
        shell: pwsh
        run: |
          $p = Start-Process dist\StreamDeckk-Kurulum.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Kurulum hata kodu: $($p.ExitCode)" }
          $exe = "$env:ProgramFiles\StreamDeckk\StreamDeckk.exe"
          if (-not (Test-Path $exe)) { throw 'Program Files altına kurulmadı' }
          $lnk = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'StreamDeckk.lnk'
          if (-not (Test-Path $lnk)) { throw 'Masaüstü kısayolu yok' }
          $rule = netsh advfirewall firewall show rule name=StreamDeckk
          if ($LASTEXITCODE -ne 0) { throw 'Güvenlik duvarı kuralı eklenmedi' }
          "Kuruldu: $exe, kısayol ve güvenlik duvarı kuralı tamam"

          $env:STREAMDECKK_DATA = "$env:RUNNER_TEMP\sd-kurulu"
          $app = Start-Process $exe -ArgumentList '--hidden' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:7373/api/ping | Out-Null; $ok = $true; break } catch { } }
          if (-not $ok) { throw 'Kurulan program yanıt vermedi' }
          "Kurulan program çalışıyor"

          $un = "$env:ProgramFiles\StreamDeckk\unins000.exe"
          $p = Start-Process $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          Start-Sleep 3
          if (Test-Path $exe) { throw 'Kaldırma sonrası exe hâlâ duruyor' }
          if (Test-Path $lnk) { throw 'Kaldırma sonrası kısayol duruyor' }
          netsh advfirewall firewall show rule name=StreamDeckk | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Kaldırma sonrası güvenlik duvarı kuralı duruyor' }
          if (Get-Process StreamDeckk -ErrorAction SilentlyContinue) { throw 'Kaldırma sonrası program hâlâ çalışıyor' }
          "Kaldırma temiz"

      - name: Öz-test sonucu
        if: steps.selftest.outcome == 'failure'
        run: exit 1

      - name: Günlük
        if: always()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\sd\streamdeckk.log" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: StreamDeckk-Windows
          path: |
            dist/StreamDeckk-Kurulum.exe
            dist/StreamDeckk.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ciktilari
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/selftest.txt
            ${{ runner.temp }}/e2e-results.json
            ${{ runner.temp }}/sd/streamdeckk.log

      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: StreamDeckk ${{ github.ref_name }}
          body: |
            **Kurulum:** `StreamDeckk-Kurulum.exe` dosyasını indir ve çalıştır. Masaüstü kısayolu ve güvenlik duvarı izni otomatik eklenir.
            Kurulumsuz kullanmak istersen `StreamDeckk.exe` tek başına da çalışır.
          files: |
            dist/StreamDeckk-Kurulum.exe
            dist/StreamDeckk.exe
